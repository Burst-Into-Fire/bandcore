# Security headers for every response nginx serves (errors too, hence "always"). The API sets the
# same ones; on /api/ nginx replaces them, so each header appears once. Keep in sync with
# SecurityHeadersFilter in the API.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; object-src 'none'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=()" always;
# Empty locally (no header is sent); set HSTS_HEADER in production.
add_header Strict-Transport-Security $hsts_header always;
