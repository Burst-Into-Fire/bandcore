# Production and staging. No defaults: a missing variable fails the startup.
spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_APP_USER}
    password: ${DB_APP_PASSWORD}
  flyway:
    user: ${DB_OWNER_USER}
    password: ${DB_OWNER_PASSWORD}
  mail:
    # Empty default: the prod validator reports it, instead of a placeholder error.
    host: ${SMTP_HOST:}
    properties:
      mail.smtp.auth: ${SMTP_AUTH:true}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:true}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:true}

springdoc:
  swagger-ui:
    enabled: false

bandcore:
  platform:
    base-domain: ${BASE_DOMAIN}
    public-scheme: https
    public-port: ${PUBLIC_URL_PORT:}
  mail:
    from: ${MAIL_FROM}
