# All settings come from environment variables. The defaults below are for local development
# only; the prod profile (application-prod.yml) removes them so a missing secret stops startup.
spring:
  application:
    name: bandcore-api
  autoconfigure:
    exclude:
      # No in-memory user with a generated password: authentication arrives in M2.
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
  datasource:
    # Runtime connection: bandcore_app owns nothing and cannot bypass row-level security.
    url: ${DB_URL:jdbc:postgresql://localhost:5432/bandcore}
    username: ${DB_APP_USER:bandcore_app}
    password: ${DB_APP_PASSWORD:dev_only_app_password}
    hikari:
      schema: bandcore
      # The JDBC driver would otherwise use the JVM time zone for the session.
      connection-init-sql: SET TIME ZONE 'UTC'
  flyway:
    # Migrations run as the schema owner, never as the runtime role.
    user: ${DB_OWNER_USER:bandcore_owner}
    password: ${DB_OWNER_PASSWORD:dev_only_owner_password}
    schemas: bandcore
    default-schema: bandcore
    create-schemas: false
    locations: classpath:db/migration
  mail:
    # Locally every email goes to Mailpit (http://localhost:8025).
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:1025}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail.smtp.auth: ${SMTP_AUTH:false}
      mail.smtp.starttls.enable: ${SMTP_STARTTLS:false}
      mail.smtp.starttls.required: ${SMTP_STARTTLS:false}
      mail.smtp.connectiontimeout: 5000
      mail.smtp.timeout: 10000
      mail.smtp.writetimeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC

server:
  port: ${PORT:8080}
  # The band comes from the Host header; forwarded headers are read only from trusted proxies
  # (bandcore.platform.trusted-proxies), never applied by the server itself.
  forward-headers-strategy: none
  servlet:
    context-path: /api
  error:
    include-exception: false
    include-message: never
    include-stacktrace: never
    include-binding-errors: never
    whitelabel:
      enabled: false

management:
  server:
    # Separate port, never routed by the public proxy.
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      show-details: never
      group:
        readiness:
          include: readinessState,db

logging:
  structured:
    format:
      console: ecs

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
  writer-with-order-by-keys: true
  show-actuator: false

bandcore:
  platform:
    # Band hosts are {slug}.BASE_DOMAIN and the central host is app.BASE_DOMAIN.
    base-domain: ${BASE_DOMAIN:localhost}
    # URLs sent to users (emails, redirects). Locally the web container listens on :3000.
    public-scheme: ${PUBLIC_URL_SCHEME:http}
    public-port: ${PUBLIC_URL_PORT:3000}
    # Comma-separated remote addresses allowed to set X-Forwarded-Host.
    trusted-proxies: ${TRUSTED_PROXIES:}
  tenancy:
    band-cache-ttl: 60s
  mail:
    from: ${MAIL_FROM:bandcore <no-reply@localhost>}
